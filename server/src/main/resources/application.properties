# Offline-First Learning Platform - Spring Boot Configuration
server.port=8080

# SQLite Datasource Configuration
spring.datasource.url=jdbc:sqlite:learning_platform.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.idle-timeout=30000

# Hibernate SQLite Configuration
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Static content and file uploads
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
spring.web.resources.static-locations=classpath:/static/

# Logging
logging.level.com.studenthelper=INFO
logging.level.org.hibernate.orm.jdbc.bind=WARN
